server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events (live log tail) - must not be buffered, or nginx holds the stream
    # until its buffer fills/the connection closes instead of forwarding each event as it
    # arrives. Matched before the general /api/ block since nginx picks the most specific
    # matching prefix location.
    location /api/logs/tail {
        proxy_pass http://backend:4000/api/logs/tail;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api/auth /api/auth;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
