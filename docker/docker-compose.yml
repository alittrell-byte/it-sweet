services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk}
      POSTGRES_DB: ${DB_NAME:-helpdesk}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-helpdesk}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '${MAILHOG_WEB_PORT:-8025}:8025' # web UI to view outgoing mail
      - '${MAILHOG_SMTP_PORT:-1025}:1025' # SMTP

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-helpdesk}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-helpdesk123}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_API_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # console

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:4200}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      DB_DIALECT: ${DB_DIALECT:-postgres}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-helpdesk}
      DB_USER: ${DB_USER:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
      LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER:-}
      LDAP_GROUP_ROLE_MAP: ${LDAP_GROUP_ROLE_MAP:-{}}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-customer}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/files
      S3_BUCKET: ${S3_BUCKET:-helpdesk-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-helpdesk}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-helpdesk123}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      EMAIL_FROM: ${EMAIL_FROM:-helpdesk@example.com}
      EMAIL_INBOUND_ENABLED: ${EMAIL_INBOUND_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      LOG_SYSLOG_ENABLED: ${LOG_SYSLOG_ENABLED:-false}
      LOG_SYSLOG_UDP_PORT: 5514
      LOG_RETENTION_SWEEP_INTERVAL_MS: ${LOG_RETENTION_SWEEP_INTERVAL_MS:-3600000}
      ALERT_EVALUATION_INTERVAL_MS: ${ALERT_EVALUATION_INTERVAL_MS:-30000}
    volumes:
      # Separate from db_data on purpose: files can be backed up, pruned, or migrated
      # to S3 independently of the database.
      - file_storage:/data/files
    ports:
      - '${BACKEND_PORT:-4000}:4000'
      # Only relevant when LOG_SYSLOG_ENABLED=true - maps the standard syslog port to the
      # backend's unprivileged internal listener. Safe to leave mapped even when disabled.
      - '${SYSLOG_UDP_PORT:-514}:5514/udp'

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-4200}:80'

volumes:
  db_data:
  file_storage:
  minio_data:
