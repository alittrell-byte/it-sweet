---
# Official Caddy repo setup - same steps as caddyserver.com's own install instructions, just as
# idempotent Ansible tasks instead of a copy-pasted shell block.
- name: Install prerequisites for adding the Caddy apt repo
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Add the Caddy GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: "0644"
  when: ansible_os_family == 'Debian'

- name: Add the Caddy apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.asc]
      https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    filename: caddy-stable
    state: present
  when: ansible_os_family == 'Debian'

- name: Install Caddy (Debian/Ubuntu)
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Check whether the Caddy dnf repo is already configured (RHEL family)
  ansible.builtin.stat:
    path: /etc/yum.repos.d/caddy-stable.repo
  register: caddy_proxy_repo_file
  when: ansible_os_family == 'RedHat'

# Cloudsmith's setup script is meant to be run, not treated as a raw .repo file - this runs the
# same vendor-provided script https://caddyserver.com/docs/install tells a human to pipe to bash.
- name: Add the Caddy dnf repo (RHEL family)
  ansible.builtin.shell: |
    set -e
    curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/config.rpm.txt -o /tmp/caddy-repo-setup.sh
    bash /tmp/caddy-repo-setup.sh
    rm -f /tmp/caddy-repo-setup.sh
  when: ansible_os_family == 'RedHat' and not caddy_proxy_repo_file.stat.exists
  changed_when: true

- name: Install Caddy (RHEL family)
  ansible.builtin.dnf:
    name: caddy
    state: present
  when: ansible_os_family == 'RedHat'

- name: Template the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0644"
  notify: Reload caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
